[package]
name = "mediagenerator-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8.9"
mediagenerator-domain = { version = "0.1.0", path = "../domain" }
oauth2 = "5.0.0"
openidconnect = "4.0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.45", features = ["serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
tower-sessions = "0.14"
tracing = "0.1.44"
url = "2.5.8"
