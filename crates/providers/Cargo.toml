[package]
name = "mediagenerator-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
azure_core = "1.1.0"
azure_identity = "1.0.0"
base64 = "0.23.1"
mediagenerator-domain = { version = "0.1.0", path = "../domain" }
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
