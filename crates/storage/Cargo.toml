[package]
name = "mediagenerator-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
azure_core = "1.1.0"
azure_identity = "1.0.0"
base64 = "0.23.1"
hmac = "0.13.0"
mediagenerator-domain = { version = "0.1.0", path = "../domain" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "time", "json", "migrate"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }
