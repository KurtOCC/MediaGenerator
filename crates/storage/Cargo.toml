[package]
name = "mediagenerator-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
mediagenerator-domain = { version = "0.1.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "time", "json", "migrate"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
