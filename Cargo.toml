[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/storage",
    "crates/auth",
    "crates/providers",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
authors = ["Oslofjord IT"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
