name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  build-image:
    name: build container image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mediagenerator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy krever at repoet har:
  #   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
  #   variables: ACR_NAME, CONTAINER_APP_NAME, RESOURCE_GROUP
  # Jobben hopper over seg selv når de mangler, så en fork eller et repo uten
  # Azure-tilgang får grønn CI i stedet for en rød deploy ingen kan fikse.
  deploy:
    name: deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [check, build-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check that Azure is configured
        id: guard
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ vars.ACR_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure secrets/variables are not set; skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      # Federated credentials, not a stored service-principal password.
      - name: Azure login
        if: steps.guard.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built in ACR rather than on the runner: the image is then produced by
      # the same path a local `az acr build` uses, and no registry password has
      # to exist anywhere.
      - name: Build and push to ACR
        if: steps.guard.outputs.ready == 'true'
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "mediagenerator:${{ github.sha }}" \
            --file Dockerfile .

      - name: Deploy revision
        if: steps.guard.outputs.ready == 'true'
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/mediagenerator:${{ github.sha }}"

      # A deploy that says "done" while the new revision is failing is worse
      # than one that fails loudly.
      - name: Verify the new revision is healthy
        if: steps.guard.outputs.ready == 'true'
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$fqdn/health"; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "the new revision never became healthy" >&2
          exit 1
